- id: 15-guest-pickups
  caption: |
    Out-of-town guests arriving at 3 different stations on 2 different days? Plan pickups like this:

    1. Collect arrival time, place and number of people per household
    2. Group arrivals within the same 1–2 hour window
    3. Assign a car and a driver contact to each group
    4. Send each family their driver's number the night before

    Nobody stranded, nobody calling the groom at 6am.
  hashtags: &logistics [WeddingLogistics, DestinationWedding, IndianWedding, WeddingPlanning, ShaadiPlanning, WeddingTips, DesiWedding, ShaadiSeason, WeddingGuests, WeddingPlanner, BigFatIndianWedding, BrideToBe]
  link: /
  media: images/15-guest-pickups.jpg
  card:
    layout: tip
    kicker: Guest logistics
    title: A pickup plan nobody gets lost in.
    points:
      - Arrival time, place, people per family
      - Group arrivals by 1–2 hour windows
      - A car and driver for each group
      - Share driver numbers the night before

