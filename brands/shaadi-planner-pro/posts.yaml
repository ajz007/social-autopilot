# Daily post queue, published top to bottom, one a day.
#
# Fields:
#   id           unique, lowercase-with-dashes; never change it after the post is published
#   caption      main text (Facebook gets the link appended, Instagram gets "Link in bio")
#   hashtags     without '#'; Facebook uses the first 3, Instagram the first 12 (see brand.yaml)
#   link         path on the site or a full URL; UTM tags are added automatically
#   media        JPEG paths the card renders to (1-10, carousel if several), or one .mp4/.mov video
#   card         the design; `slides:` makes a carousel. Layouts: tip, image, statement.
#                `scene:` lights | toran | diyas | mehendi | kolam | dhol; `align:` top | center
#   not_before   optional date; the post waits until then
#   facebook / instagram: { caption: ... }   optional per-platform caption override
#
# Images are not stored ahead of time: the Sunday "Prepare week" workflow renders the
# next 7 days and opens a pull request. Merging it approves that week.
#
# Weekly rhythm (2 of 7 posts mention the product):
#   1 quote · 2 guess · 3 relatable question · 4 problem → fix carousel ·
#   5 tradition / nostalgia · 6 useful tip · 7 product showcase

