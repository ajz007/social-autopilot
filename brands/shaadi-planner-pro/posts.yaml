# Daily post queue, published top to bottom, one a day.
#
# Fields:
#   id           unique, lowercase-with-dashes; never change it after the post is published
#   caption      main text (Facebook gets the link appended, Instagram gets "Link in bio")
#   hashtags     without '#'; Facebook uses the first 3, Instagram the first 12 (see brand.yaml)
#   link         path on the site or a full URL; UTM tags are added automatically
#   media        JPEG images (1-10, carousel if several) or one .mp4/.mov video
#   card         how `python -m autopilot render` draws the image(s); use `slides:` for a carousel
#   not_before   optional date; the post waits until then
#   facebook / instagram: { caption: ... }   optional per-platform caption override
#
# Weekly rhythm: Mon tip · Tue product · Wed question · Thu tip · Fri invitation · Sat relatable · Sun checklist

- id: 01-guest-list-households
  caption: |
    The guest list mistake almost every family makes: counting people instead of households.

    Invitations, RSVPs, follow-up calls and rooms all happen per family, not per person. Start your list with one row per household, then add the people in it.

    Save this for when the "final list" conversation starts at home 😅
  hashtags: &core [IndianWedding, ShaadiPlanning, WeddingPlanning, DesiWedding, ShaadiSeason, WeddingTips, IndianBride, BigFatIndianWedding, WeddingPlanner, ShaadiDiaries, BrideToBe, WeddingIndia]
  link: /
  media: images/01-guest-list-households.jpg
  card:
    layout: tip
    kicker: Guest list tip
    title: Count households, not heads.
    points:
      - One row per family you invite
      - Add each person under their household
      - Track RSVP and follow-up per household
      - Headcount adds itself up from there

