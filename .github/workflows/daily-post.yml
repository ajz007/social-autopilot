name: Daily post

on:
  schedule:
    # 13:30 UTC = 19:00 IST, an evening slot when Indian audiences are most active.
    # GitHub may start scheduled runs a few minutes late; the one-post-per-day guard makes that safe.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually publish (unchecked = dry run preview)"
        type: boolean
        default: false
      post_id:
        description: "Publish this post id instead of the next one (optional)"
        type: string
        required: false
      platform:
        description: "Only this platform (optional)"
        type: choice
        options: ["", facebook, instagram]
        default: ""

permissions:
  contents: write # commits state/<brand>.json so the next run knows what was published

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        brand: [shaadi-planner-pro]
    env:
      AUTOPILOT_PAUSED: ${{ vars.AUTOPILOT_PAUSED }}
      SPP_FB_PAGE_ID: ${{ secrets.SPP_FB_PAGE_ID }}
      SPP_FB_PAGE_TOKEN: ${{ secrets.SPP_FB_PAGE_TOKEN }}
      SPP_IG_USER_ID: ${{ secrets.SPP_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Validate queue
        run: python -m autopilot validate --brand ${{ matrix.brand }}

      - name: Publish
        env:
          # Scheduled runs only publish once the repository variable AUTOPILOT_LIVE is "true".
          LIVE: ${{ github.event_name == 'schedule' && vars.AUTOPILOT_LIVE == 'true' || github.event_name == 'workflow_dispatch' && inputs.live }}
          POST_ID: ${{ inputs.post_id }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          args=(post --brand "${{ matrix.brand }}")
          [ "$LIVE" = "true" ] && args+=(--live)
          [ -n "$POST_ID" ] && args+=(--post-id "$POST_ID")
          [ -n "$PLATFORM" ] && args+=(--platform "$PLATFORM")
          python -m autopilot "${args[@]}"

      - name: Save publishing history
        if: always()
        run: |
          git config user.name "social-autopilot"
          git config user.email "social-autopilot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ${{ matrix.brand }} post $(date -u +%F)"
          git pull --rebase
          git push
