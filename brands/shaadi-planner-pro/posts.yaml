- id: 22-room-allocation
  caption: |
    Room allocation is a family-politics puzzle 🧩 A few rules that keep the peace:

    • Elders get ground floor or lift access, always
    • Keep each household together
    • Put the families with small kids near each other
    • Leave 1–2 rooms free for last-minute arrivals
    • Share the final room list with the hotel AND the family
  hashtags: *logistics
  link: /
  media: images/22-room-allocation.jpg
  card:
    layout: tip
    kicker: Guest stay
    title: Room allocation, without the drama.
    points:
      - Elders near the lift or ground floor
      - Keep each household together
      - Families with kids side by side
      - Hold 1–2 rooms for surprises

