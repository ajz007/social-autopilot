- id: 04-rsvp-follow-up
  caption: |
    RSVPs don't come back on their own. Here's a follow-up rhythm that works without annoying anyone:

    • 3 weeks out: send the invitation with a clear reply-by date
    • 10 days before the reply-by date: a friendly reminder on WhatsApp
    • 2 days after it: a phone call from someone the family knows
    • Track who's confirmed per household so nobody gets called twice

    Tag the cousin who'll be making those calls 📞
  hashtags: &rsvp [RSVP, IndianWedding, WeddingPlanning, ShaadiPlanning, WeddingTips, DesiWedding, ShaadiSeason, WeddingGuests, IndianBride, BigFatIndianWedding, WeddingPlanner, BrideToBe]
  link: /
  media: images/04-rsvp-follow-up.jpg
  card:
    layout: tip
    kicker: RSVP tip
    title: The no-awkwardness RSVP follow-up.
    points:
      - "3 weeks out: invite with a reply-by date"
      - "10 days before it: a WhatsApp reminder"
      - "2 days after it: a call from family"
      - Track replies per household

