- id: w2-tip-rooms
  caption: |
    Room allocation is a family-politics puzzle 🧩 A few rules that keep the peace:

    • Elders get the ground floor or lift access, always
    • Keep each household together
    • Put families with small kids near each other
    • Hold 1–2 rooms for last-minute arrivals
    • Share the final list with the hotel AND the family

    Save it for when the room list starts 📌
  hashtags: &logistics [WeddingLogistics, DestinationWedding, IndianWedding, WeddingPlanning, ShaadiPlanning, WeddingTips, DesiWedding, ShaadiSeason, WeddingGuests, WeddingPlanner, BigFatIndianWedding, BrideToBe]
  media: images/w2-tip-rooms.jpg
  card:
