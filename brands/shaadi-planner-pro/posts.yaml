- id: 18-vendor-negotiation
  caption: |
    Before you sign with any vendor, get these 5 things in writing:

    1. Exact deliverables (hours, items, people)
    2. The payment schedule and what's refundable
    3. What happens if the date moves
    4. Extra charges: travel, overtime, taxes
    5. Who your contact is on the day

    It's not rude, it's how good vendors like to work too.
  hashtags: *vendor
  link: /shop
  media: images/18-vendor-negotiation.jpg
  card:
    layout: tip
    kicker: Vendor tip
    title: Get these 5 things in writing.
    points:
      - Exact deliverables
      - Payment schedule and refunds
      - What if the date moves
      - Travel, overtime, taxes
      - Your contact on the day

