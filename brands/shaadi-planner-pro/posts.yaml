- id: 08-budget-buffer
  caption: |
    The one budget line every Indian wedding needs and almost nobody adds: a 10–15% buffer.

    Extra guests turn up, the decor quote changes, someone needs one more outfit. If the buffer isn't in the plan, it comes out of something you cared about.

    Track planned vs. actually paid for every vendor, so you always know what's really left.
  hashtags: &budget [WeddingBudget, IndianWedding, WeddingPlanning, ShaadiPlanning, WeddingTips, MoneyTips, DesiWedding, ShaadiSeason, BrideToBe, WeddingPlanner, BigFatIndianWedding, IndianBride]
  link: /shop/essentials
  media: images/08-budget-buffer.jpg
  card:
    layout: tip
    kicker: Budget tip
    title: Add a 10–15% buffer. Always.
    points:
      - Extra guests always appear
      - Quotes change after you book
      - Track planned vs. actually paid
      - Know what's truly left each week

