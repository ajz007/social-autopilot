- id: w3-tip-vendors
  caption: |
    Before you sign with any vendor, get these 5 things in writing ✍️

    1. Exact deliverables (hours, items, people)
    2. The payment schedule and what's refundable
    3. What happens if the date moves
    4. Extra charges: travel, overtime, taxes
    5. Who your contact is on the day

    It isn't rude. Good vendors prefer it too. Save this 📌
  hashtags: &vendor [WeddingVendors, WeddingTips, IndianWedding, WeddingPlanning, ShaadiPlanning, DesiWedding, ShaadiSeason, WeddingBudget, BrideToBe, WeddingPlanner, IndianBride, BigFatIndianWedding]
  media: images/w3-tip-vendors.jpg
  card:
    layout: tip
    scene: lights
    kicker: Vendor tip
    title: Get these 5 things in writing.
    points:
      - Exact deliverables
      - Payment schedule and refunds
      - What if the date moves
      - Travel, overtime, taxes
      - Your contact on the day

